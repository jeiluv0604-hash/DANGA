# Render Blueprint for the DAMGA-OPS backend API.
# Deploy: push to GitHub, then in Render > New > Blueprint, point at this repo.
services:
  - type: web
    name: damga-ops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_VERSION
        value: 6.0.0-prototype
      # Point SQLite at a scratch path so every boot starts from a clean schema
      # (a stale half-migrated file under the build dir would break alembic and
      # create_all). /tmp is writable and reset per instance; the app migrates
      # and re-seeds the SYNTHETIC dataset on startup, so this is by design.
      # Operator-entered data (imports, decision actions) does not persist —
      # for that, provision managed Postgres and set DATABASE_URL to it instead.
      - key: DATABASE_URL
        value: sqlite:////tmp/damga_ops.db
